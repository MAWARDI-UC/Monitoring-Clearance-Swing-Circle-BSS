<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING CLEARANCE SWING CIRCLE</title>
    <!-- Font Google -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- PapaParse untuk membaca data CSV dari Google Sheets - FIXED: Hapus double .min -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #121824;
            --border-color: #1a2638;
            --cyan-primary: #00f2ff;
            --cyan-glow: rgba(0, 242, 255, 0.25);
            --text-main: #e0f7fa;
            --text-muted: #8198a6;
            
            /* Status Colors */
            --status-safe: #00ff88;
            --status-warning: #ffcc00;
            --status-critical: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--cyan-primary);
            text-shadow: 0 0 10px var(--cyan-glow);
            letter-spacing: 1.5px;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .refresh-status {
            font-size: 12px;
            color: var(--text-muted);
            text-align: right;
        }

        /* SUMMARY CARDS */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--cyan-primary);
        }

        .card h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card .value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }

        /* CONTROLS (SEARCH) */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 16px;
            color: var(--text-main);
            outline: none;
            width: 280px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        /* TABLE STYLING */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        thead {
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 2px solid var(--border-color);
        }

        th {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--cyan-primary);
            padding: 14px 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: #d1d5db;
        }

        tbody tr:hover {
            background: rgba(0, 242, 255, 0.02);
        }

        /* STATUS BADGES */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-normal, .badge-safe {
            background: rgba(0, 255, 136, 0.1);
            color: var(--status-safe);
            border: 1px solid var(--status-safe);
        }

        .badge-warning {
            background: rgba(255, 204, 0, 0.1);
            color: var(--status-warning);
            border: 1px solid var(--status-warning);
        }

        .badge-critical, .badge-danger {
            background: rgba(255, 51, 102, 0.1);
            color: var(--status-critical);
            border: 1px solid var(--status-critical);
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.3);
        }

        .loading-text {
            text-align: center;
            padding: 20px;
            color: var(--cyan-primary);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-title">
            <h1>MONITORING CLEARANCE SWING CIRCLE</h1>
            <p>Real-Time Undercarriage & Swing System Wear Tracking</p>
        </div>
        <div class="refresh-status" id="lastUpdated">
            Live Connected to Google Sheets
        </div>
    </header>

    <!-- METRICS / SUMMARY CARDS -->
    <div class="metrics-grid">
        <div class="card">
            <h3>Total Unit Monitored</h3>
            <div class="value" id="totalUnit">0</div>
        </div>
        <div class="card">
            <h3>Status Normal</h3>
            <div class="value" id="countNormal" style="color: var(--status-safe);">0</div>
        </div>
        <div class="card">
            <h3>Status Warning</h3>
            <div class="value" id="countWarning" style="color: var(--status-warning);">0</div>
        </div>
        <div class="card">
            <h3>Status Critical</h3>
            <div class="value" id="countCritical" style="color: var(--status-critical);">0</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari No Unit / Site...">
        </div>
    </div>

    <!-- MAIN TABLE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>NO UNIT</th>
                    <th>SITE</th>
                    <th>TANGGAL</th>
                    <th>HM</th>
                    <th>WORN</th>
                    <th>STATUS WORN</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="loading-text">Memuat Data dari Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- SCRIPT LOGIC (FETCH CSV DATA & SEARCH) -->
    <script>
        // FIXED: Gunakan format export CSV yang correct (tanpa /e/ atau dengan export?format=csv)
        const csvUrl = 'https://docs.google.com/spreadsheets/d/2PACX-1vSTqHoQ-vvmkYXEV_LLxsyQsaCxo25Voc-8q_N9JD7rDhUMl5HZtGPU4m08LRr4kwDGegegXpVcJZBk/export?format=csv';

        // Fungsi untuk Mengambil & Menampilkan Data dari Google Sheets
        function loadSheetData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    renderTableAndCards(data);
                },
                error: function(err) {
                    console.error('Error fetching CSV:', err);
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">Gagal memuat data dari Google Sheets! Pastikan spreadsheet di-share publik.</td></tr>';
                }
            });
        }

        // Render Data ke Tabel dan Hitung Card Stats
        function renderTableAndCards(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let normalCount = 0;
            let warningCount = 0;
            let criticalCount = 0;
            let totalCount = 0;

            data.forEach(row => {
                // Mengambil nilai berdasarkan nama kolom di Spreadsheet
                const noUnit = row['NO UNIT'] || row['No Unit'] || row['UNIT'] || '-';
                const site = row['SITE'] || row['Site'] || '-';
                const tanggal = row['TANGGAL'] || row['Tanggal'] || '-';
                const hm = row['HM'] || row['Hm'] || '-';
                const worn = row['WORN'] || row['Worn'] || '-';
                const statusWorn = (row['STATUS WORN'] || row['Status Worn'] || row['STATUS'] || '-').toUpperCase().trim();

                if (noUnit === '-' && site === '-') return; // Lewati baris kosong

                totalCount++;

                // Logika Badge Status & Counter Stats
                let badgeClass = 'badge-normal';
                if (statusWorn.includes('WARN') || statusWorn.includes('KUNING')) {
                    badgeClass = 'badge-warning';
                    warningCount++;
                } else if (statusWorn.includes('CRIT') || statusWorn.includes('DANGER') || statusWorn.includes('MERAH')) {
                    badgeClass = 'badge-critical';
                    criticalCount++;
                } else {
                    badgeClass = 'badge-normal';
                    normalCount++;
                }

                // Append Baris ke Tabel
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${noUnit}</strong></td>
                    <td>${site}</td>
                    <td>${tanggal}</td>
                    <td>${hm}</td>
                    <td>${worn}</td>
                    <td><span class="badge ${badgeClass}">${statusWorn}</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Update Ringkasan Stat Cards
            document.getElementById('totalUnit').innerText = totalCount;
            document.getElementById('countNormal').innerText = normalCount;
            document.getElementById('countWarning').innerText = warningCount;
            document.getElementById('countCritical').innerText = criticalCount;
        }

        // Feature Filter/Search
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let rows = document.getElementById('tableBody').getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                let textContent = rows[i].textContent || rows[i].innerText;
                if (textContent.toUpperCase().indexOf(filter) > -1) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        });

        // Jalankan Pemuatan Data Pertama Kali
        loadSheetData();
    </script>
</body>
</html>
