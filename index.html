<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING CLEARANCE SWING CIRCLE</title>
    <!-- Font Google: Inter / Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- PapaParse Library - FIXED CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #121824;
            --border-color: #1a2638;
            --cyan-primary: #00f2ff;
            --cyan-glow: rgba(0, 242, 255, 0.25);
            --text-main: #e0f7fa;
            --text-muted: #8198a6;
            
            /* Status Colors */
            --status-safe: #00ff88;
            --status-warning: #ffcc00;
            --status-critical: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--cyan-primary);
            text-shadow: 0 0 10px var(--cyan-glow);
            letter-spacing: 1.5px;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .refresh-status {
            font-size: 12px;
            color: var(--text-muted);
            text-align: right;
        }

        /* SUMMARY CARDS */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--cyan-primary);
        }

        .card h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card .value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
        }

        /* CONTROLS (SEARCH & FILTER) */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 16px;
            color: var(--text-main);
            outline: none;
            width: 280px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .btn-refresh {
            background: var(--cyan-primary);
            color: var(--bg-dark);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background: #00d9ff;
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .btn-refresh:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        /* TABLE STYLING */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        thead {
            background: rgba(0, 242, 255, 0.05);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
        }

        th {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--cyan-primary);
            padding: 14px 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: #d1d5db;
        }

        tbody tr:hover {
            background: rgba(0, 242, 255, 0.02);
        }

        /* STATUS BADGES */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-normal {
            background: rgba(0, 255, 136, 0.1);
            color: var(--status-safe);
            border: 1px solid var(--status-safe);
        }

        .badge-warning {
            background: rgba(255, 204, 0, 0.1);
            color: var(--status-warning);
            border: 1px solid var(--status-warning);
        }

        .badge-critical {
            background: rgba(255, 51, 102, 0.1);
            color: var(--status-critical);
            border: 1px solid var(--status-critical);
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.3);
        }

        .loading-text {
            text-align: center;
            padding: 20px;
            color: var(--cyan-primary);
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: var(--status-critical);
            background: rgba(255, 51, 102, 0.1);
            border-radius: 8px;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

        .refresh-timer {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .metrics-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .search-box input {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-title">
            <h1>MONITORING CLEARANCE SWING CIRCLE</h1>
            <p>Real-Time Undercarriage & Swing System Wear Tracking</p>
        </div>
        <div class="refresh-status">
            <div id="lastUpdated">Loading...</div>
            <div class="refresh-timer" id="refreshTimer"></div>
        </div>
    </header>

    <!-- METRICS / SUMMARY CARDS -->
    <div class="metrics-grid">
        <div class="card">
            <h3>Total Unit Monitored</h3>
            <div class="value" id="totalUnit">0</div>
        </div>
        <div class="card">
            <h3>Status Normal</h3>
            <div class="value" id="countNormal" style="color: var(--status-safe);">0</div>
        </div>
        <div class="card">
            <h3>Status Warning</h3>
            <div class="value" id="countWarning" style="color: var(--status-warning);">0</div>
        </div>
        <div class="card">
            <h3>Status Critical</h3>
            <div class="value" id="countCritical" style="color: var(--status-critical);">0</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari No Unit / Site / Status...">
        </div>
        <button class="btn-refresh" id="refreshBtn" onclick="loadSheetData()">🔄 Refresh Data</button>
    </div>

    <!-- MAIN TABLE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>NO UNIT</th>
                    <th>SITE</th>
                    <th>TANGGAL</th>
                    <th>HM</th>
                    <th>WORN (%)</th>
                    <th>STATUS WORN</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="loading-text">📊 Memuat Data dari Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- SCRIPT LOGIC (FETCH CSV DATA & SEARCH) -->
    <script>
        // ============================================
        // KONFIGURASI GOOGLE SHEETS
        // ============================================
        // GANTI DENGAN ID SPREADSHEET ANDA
        const SPREADSHEET_ID = '2PACX-1vSTqHoQ-vvmkYXEV_LLxsyQsaCxo25Voc-8q_N9JD7rDhUMl5HZtGPU4m08LRr4kwDGegegXpVcJZBk';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
        
        let allData = [];
        let refreshInterval = null;

        // ============================================
        // FUNGSI: Load Data dari Google Sheets
        // ============================================
        function loadSheetData() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ Loading...';

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        allData = results.data.filter(row => {
                            // Filter baris yang tidak kosong
                            return (row['NO UNIT'] && row['NO UNIT'].trim()) || 
                                   (row['UNIT'] && row['UNIT'].trim()) ||
                                   (row['No Unit'] && row['No Unit'].trim());
                        });
                        
                        renderTableAndCards(allData);
                        updateLastUpdated();
                        console.log(`✅ Data loaded: ${allData.length} records`);
                    } else {
                        showError('Tidak ada data ditemukan di spreadsheet!');
                    }

                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔄 Refresh Data';
                },
                error: function(err) {
                    console.error('❌ Error fetching CSV:', err);
                    showError('Gagal memuat data! Periksa:<br>1. Spreadsheet ID benar<br>2. Spreadsheet di-share publik<br>3. Koneksi internet stabil');
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔄 Refresh Data';
                }
            });
        }

        // ============================================
        // FUNGSI: Render Tabel dan Update Cards
        // ============================================
        function renderTableAndCards(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let normalCount = 0;
            let warningCount = 0;
            let criticalCount = 0;
            let totalCount = 0;

            data.forEach(row => {
                // Extract data dengan fallback untuk variasi nama kolom
                const noUnit = row['NO UNIT'] || row['No Unit'] || row['UNIT'] || row['Unit'] || '-';
                const site = row['SITE'] || row['Site'] || row['LOKASI'] || row['Lokasi'] || '-';
                const tanggal = row['TANGGAL'] || row['Tanggal'] || row['DATE'] || row['Date'] || '-';
                const hm = row['HM'] || row['Hm'] || row['HOURS'] || row['Hours'] || '-';
                const worn = row['WORN'] || row['Worn'] || row['WEAR'] || row['Wear'] || '-';
                const statusWorn = (row['STATUS WORN'] || row['Status Worn'] || row['STATUS'] || row['Status'] || 'UNKNOWN')
                    .toUpperCase()
                    .trim();

                if (!noUnit || noUnit === '-') return;

                totalCount++;

                // Tentukan badge class berdasarkan status
                let badgeClass = 'badge-normal';
                let displayStatus = statusWorn;

                if (statusWorn.includes('WARN') || statusWorn.includes('KUNING') || statusWorn.includes('ORANGE')) {
                    badgeClass = 'badge-warning';
                    warningCount++;
                    displayStatus = 'WARNING';
                } else if (statusWorn.includes('CRIT') || statusWorn.includes('DANGER') || statusWorn.includes('MERAH') || statusWorn.includes('RED')) {
                    badgeClass = 'badge-critical';
                    criticalCount++;
                    displayStatus = 'CRITICAL';
                } else {
                    badgeClass = 'badge-normal';
                    normalCount++;
                    displayStatus = 'NORMAL';
                }

                // Create table row
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${noUnit}</strong></td>
                    <td>${site}</td>
                    <td>${tanggal}</td>
                    <td>${hm}</td>
                    <td>${worn}</td>
                    <td><span class="badge ${badgeClass}">${displayStatus}</span></td>
                `;
                tbody.appendChild(tr);
            });

            // Jika tidak ada data
            if (totalCount === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-results">❌ Tidak ada data yang ditemukan</td></tr>';
                document.getElementById('totalUnit').innerText = '0';
                document.getElementById('countNormal').innerText = '0';
                document.getElementById('countWarning').innerText = '0';
                document.getElementById('countCritical').innerText = '0';
                return;
            }

            // Update summary cards
            document.getElementById('totalUnit').innerText = totalCount;
            document.getElementById('countNormal').innerText = normalCount;
            document.getElementById('countWarning').innerText = warningCount;
            document.getElementById('countCritical').innerText = criticalCount;
        }

        // ============================================
        // FUNGSI: Show Error Message
        // ============================================
        function showError(message) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="error-message">${message}</td></tr>`;
        }

        // ============================================
        // FUNGSI: Update Last Updated Time
        // ============================================
        function updateLastUpdated() {
            const now = new Date();
            const timeStr = now.toLocaleString('id-ID', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('lastUpdated').innerText = `✅ Last Updated: ${timeStr}`;
        }

        // ============================================
        // FUNGSI: Search/Filter
        // ============================================
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let rows = document.getElementById('tableBody').getElementsByTagName('tr');
            let visibleCount = 0;

            for (let i = 0; i < rows.length; i++) {
                let textContent = rows[i].textContent || rows[i].innerText;
                if (textContent.toUpperCase().indexOf(filter) > -1) {
                    rows[i].style.display = "";
                    visibleCount++;
                } else {
                    rows[i].style.display = "none";
                }
            }

            // Show message if no results
            if (visibleCount === 0 && filter.length > 0) {
                const tbody = document.getElementById('tableBody');
                if (tbody.querySelector('.no-results') === null) {
                    tbody.innerHTML += '<tr><td colspan="6" class="no-results">Tidak ada hasil pencarian untuk: "' + this.value + '"</td></tr>';
                }
            }
        });

        // ============================================
        // INIT: Auto-load data on page load
        // ============================================
        window.addEventListener('load', function() {
            loadSheetData();
            
            // Auto-refresh setiap 5 menit (300000 ms)
            refreshInterval = setInterval(loadSheetData, 300000);
        });

        // Cleanup on page unload
        window.addEventListener('unload', function() {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
